version: '3.9'

services:
  main:
    build:
      context: .
      dockerfile: Main/Dockerfile
    container_name: main
    ports:
      - "5001:80"
    depends_on:
      - module
      - db
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User=sa;Password=YourStrong!Pass123;Encrypt=False;TrustServerCertificate=True;

  module:
    build:
      context: .
      dockerfile: DNDWiki/Dockerfile
    container_name: module
    depends_on:
      - db
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__IdentityConnection=Server=db;Database=IdentityDb;User=sa;Password=YourStrong!Pass123;Encrypt=False;TrustServerCertificate=True;
      - ConnectionStrings__DndConnection=Server=db;Database=WikiDb;User=sa;Password=YourStrong!Pass123;Encrypt=False;TrustServerCertificate=True;

  db:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: db
    environment:
      - SA_PASSWORD=YourStrong!Pass123
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"